[package]
name = "dx_use_js_bridge"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# Core dependencies for the JS bridge
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21.3"
uuid = { version = "1.8", optional = true }
chrono = { version = "0.4", features = ["serde"] }

# Dioxus dependencies - only included in default feature
dioxus = { version = "0.7.0-alpha.3", optional = true }
dioxus-signals = { version = "0.7.0-alpha.3", optional = true }

# HTTP server dependencies for lobby service
axum = { version = "0.7", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors"], optional = true }

# Web dependencies that are enabled via the "web" feature.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2" }
web-sys = { version = "0.3" }
js-sys = { version = "0.3" }
serde-wasm-bindgen = { version = "0.6" }
gloo-utils = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
jni = "0.21.1"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
dioxus-desktop = "0.7.0-alpha.3"

[features]
default = ["js-bridge", "uuid"]
js-bridge = ["dep:dioxus", "dep:dioxus-signals"]
web = ["js-bridge"]
android = ["js-bridge"]
uuid = ["dep:uuid"]
lobby-server = ["dep:axum", "dep:tokio", "dep:tower", "dep:tower-http", "uuid"]

[[bin]]
name = "lobby-server"
path = "src/bin/lobby_server.rs"
required-features = ["lobby-server"]
